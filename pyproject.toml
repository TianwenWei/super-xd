[project]
name = "super-xd-nlp"
version = "0.1.0"
description = "Receipt-driven NLP Agent Harness for vehicle integration"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anyio>=4,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "google-auth[requests]>=2.40,<3",
  "pydantic>=2.10,<3",
  "jsonschema>=4.23,<5",
  "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
demo = ["numpy>=2,<3", "python-dotenv>=1,<2", "websockets>=14,<17", "google-cloud-texttospeech==2.38.0"]
manual-index = ["numpy>=2,<3", "pypdf>=6,<7"]
local-vad = ["numpy>=2,<3", "onnxruntime>=1.20,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "mypy>=1.15,<2", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F821", "F822", "F823"]

[tool.mypy]
python_version = "3.12"
files = ["backend/nlp_settings.py", "backend/harness/observability.py", "backend/harness/model_execution.py", "backend/local_environment.py", "backend/harness/contracts.py", "backend/harness/gateway_contracts.py"]
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Existing contracts are checked, including typed function bodies; annotation
# completeness is tightened incrementally rather than hiding their type errors.
[[tool.mypy.overrides]]
module = ["backend.harness.contracts", "backend.harness.gateway_contracts"]
disallow_untyped_defs = false
