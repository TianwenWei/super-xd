# Thinker 工具与参数的模型说明。这里只编辑文字；工具名、类型、枚举和范围由代码负责。

[search_web]
description = "真实 Tavily 网络搜索。返回来源 URL 和本次查询时间；不能用记忆替代实时检索。"

[extract_web]
description = "真实 Tavily Extract 读取已经搜索获得的页面，核实与任务相关的信息。"

[load_skill]
description = "查看一个车辆子系统的详细说明、函数和参数schema。"

[ask_clarification]
description = "必要条件不足时只问一个关键问题，用简短自然口语提问并暂停任务；释放并发名额，收到答复后继续。"

[suggest_vehicle_action]
description = "提出一个模拟车辆动作建议。只保存建议，由会话层结合最新车况重新校验执行。"

[finish_task]
description = "同时提交完整报告summary与简短口语spoken_summary，不增加润色步骤。只能引用本任务真实搜索/读取过的来源。"

[finish_task.parameters]
spoken_summary = "中性自然口语，先说最有用的结论，1至3句。不要Markdown、列表、表格、URL、引用标记、JSON或任务/工具编号。保留必要的未核实、尚未执行等限制。"
reuse_prior_evidence = "仅在核对已有真实资料仍完整支持本次补充条件后为true；否则必须补查。"
forecast_claims = "仅context.query_domain=weather的任务使用：逐项照抄get_weather_forecast返回的date、source_url、temperature_min、temperature_max。系统据此播报温度，summary与spoken_summary不要再写温度数字。其他任务不填，温度照常写进summary和spoken_summary。"
official_source_status = "任务指定官方来源时必填：真实读到官方页面且含答案为verified，否则not_verified。"
source_urls = "只列实际读取过的页面或工具返回的source_url；只在搜索结果里出现、没读过的页面不要列。"

[get_weather_forecast]
description = "查询明确城市和日期的真实结构化天气预报（Open-Meteo），只提供日最低/最高气温，不提供雨晴、降水或风力，不得由温度推断这些现象。未来温度优先此工具，历史记录或气候平均值不能当未来预报。城市不明确需澄清；本工具不能冒充用户指定的气象局官网。"

[get_weather_forecast.parameters]
date = "目标城市当地日期YYYY-MM-DD；按当前时间与用户所指日期填写"
country_code = "用户已明确的ISO两字母国家代码，用于区分同名城市；不猜测"

[lookup_web]
description = "快速实时核实：真实Search后按相关性排序读取前两个实际来源页面，一次返回完整搜索和Extract材料。"
