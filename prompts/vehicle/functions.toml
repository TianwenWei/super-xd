description = "设备音量、静音、播放状态、音源、FM频率、声场与均衡器；座舱内容搜索与播放另走search_media/control_media。"

[functions.get_media_state]
description = "请求设备读取媒体状态；座舱播放器状态用control_media的get_status读取。"

[functions.set_volume]
description = "请求设置媒体音量百分比；已有座舱媒体状态时按control_media的volume协议处理，执行以实际回执为准。"

[functions.set_volume.parameters]
