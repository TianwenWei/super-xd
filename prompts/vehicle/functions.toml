[functions.set_mute]
description = "请求设备开关媒体静音"

[functions.set_mute.parameters]
enabled = "是否静音"

[functions.control_playback]
description = "请求控制已选媒体的播放、暂停、停止或上下首；已有座舱媒体状态时按control_media协议处理，play表示恢复已有内容resume。播放新内容须search_media后用control_media的play；无座舱媒体状态时只使用明确声明的设备能力，完成以实际回执为准。"

[functions.control_playback.parameters]
