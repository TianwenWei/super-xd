[functions.add_navigation_waypoint]
description = "请求设备追加原文地点作为途经点，最多10个；不计算路线。已有来源POI应使用manage_navigation的add_waypoint。"

[functions.add_navigation_waypoint.parameters]
destination = "途经点名称或地址"

[functions.remove_navigation_waypoint]
description = "请求设备删除指定索引的途经点，索引从0开始；已有来源POI应按manage_navigation的waypoint_ref处理。"

[functions.remove_navigation_waypoint.parameters]
