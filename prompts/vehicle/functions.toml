description = "请求设备保存家的导航地址，不表示开始导航。"

[functions.set_home_destination.parameters]
destination = "家的地址"

[functions.set_work_destination]
description = "请求设备保存公司的导航地址，不表示开始导航。"

[functions.set_work_destination.parameters]
destination = "公司的地址"
