[skills.navigation]
name = "导航"
description = "设备目的地、途经点、通行偏好及家和公司地址；有来源POI用manage_navigation，真实路线查询须有配置的路线提供商。"

[functions.get_navigation_state]
description = "请求设备读取导航目的地、途经点与偏好；仅依据实际返回内容回答，不推断路线或到达时间。"

[functions.set_navigation_destination]
description = "将用户原文中的明确地点名或地址交给设备，请求设为导航目的地；不自行解析成POI或计算真实路线，不订座支付，是否开始导航以设备回执为准。"

[functions.set_navigation_destination.parameters]
