name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra demo --extra manual-index
      - run: uv run --no-sync python -m pytest -q
        env:
          PYTHON_DOTENV_DISABLED: "1"
      - run: uv run --no-sync python -m scripts.validate_prompt_config
      - run: uv run --no-sync python -m scripts.validate_service_config
      - run: uv run --no-sync mypy
      - run: uv run --no-sync ruff check backend evals scripts tests
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev
      - run: uv run --no-sync python -m scripts.check_import_boundaries --smoke-startup
      - run: uv export --locked --no-dev --no-editable --no-emit-project --format requirements-txt --output-file requirements.nlp.lock.txt
      - run: git diff --exit-code requirements.nlp.lock.txt
      - run: docker build -t super-xd-nlp:ci .
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node --test tests/*.test.mjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
